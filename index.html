<script>
let contador = 0;

function mostrarPantalla(pantalla){
  if(pantalla === "parte"){
    document.getElementById("pantallaParte").style.display = "block";
    document.getElementById("pantallaGuardados").style.display = "none";
  }

  if(pantalla === "guardados"){
    document.getElementById("pantallaParte").style.display = "none";
    document.getElementById("pantallaGuardados").style.display = "block";
  }
}

function mostrarCodigo(){
  const input = document.getElementById("codigo");
  if(input.value && !input.value.startsWith("Código ")){
    input.value = "Código " + input.value;
  }
}

function limpiarCodigo(){
  const input = document.getElementById("codigo");
  input.value = input.value.replace("Código ", "");
}

function saltoMaterial(){
  const input = document.getElementById("material1");
  if(input.value.length >= 2){
    document.getElementById("material2").focus();
  }
}

function soloUno(tipo){
  if(tipo === "S"){
    document.getElementById("checkW").checked = false;
  } else {
    document.getElementById("checkS").checked = false;
  }
}

function addBobina(datos = null){
  contador++;

  const div = document.createElement("div");
  div.className = "bobina";
  div.id = "b" + contador;

  div.innerHTML = `
    <b>BOBINA ${contador}</b>

    <div class="row">
<input class="bob-marcha" type="time" placeholder="Inicio"
oninput="saltoEnBobina(this, 'bob-parada', 5)"
onchange="calcularTotal(this)">

<input class="bob-parada" type="time" placeholder="Fin"
onchange="calcularTotal(this)">
</div>

    <div class="row">
      <input class="bob-total" type="tel" inputmode="numeric" placeholder="Total"
onblur="ponerTexto(this, 'Total')" onfocus="limpiarTexto(this, 'Total')">

<input class="bob-acum" type="tel" inputmode="numeric" placeholder="Acum"
onblur="ponerTexto(this, 'Acum')" onfocus="limpiarTexto(this, 'Acum')">
    </div>
    
    <div class="row">
      <input class="bob-cambio" type="text" inputmode="numeric" maxlength="2" placeholder="Cambio"
oninput="filtrarNumeros(this); calcularCambioAcumulado(); saltoEnBobina(this, 'bob-golpes', 2)">
<input class="bob-cambio-acum" type="tel" inputmode="numeric" placeholder="Cambio acum">
    </div>

    <div class="row">
      <input class="bob-golpes" type="tel" inputmode="numeric" placeholder="Total de golpes"
onblur="ponerTexto(this, 'Total de golpes')" 
onfocus="limpiarTexto(this, 'Total de golpes')">
<input class="bob-primeras" type="tel" inputmode="numeric" placeholder="Hojas de primera"
onblur="ponerTexto(this, 'Hojas de primera')" onfocus="limpiarTexto(this, 'Hojas de primera')">
    </div>

    <div class="row">
      <input class="bob-esp-mas" type="tel" inputmode="numeric" placeholder="+Esp"
onblur="ponerTexto(this, '+Esp')" onfocus="limpiarTexto(this, '+Esp')">
      <input class="bob-esp-menos" type="tel" inputmode="numeric" placeholder="-Esp"
onblur="ponerTexto(this, '-Esp')" onfocus="limpiarTexto(this, '-Esp')">
    </div>

   <div class="row">
  <input class="bob-visual" type="tel" inputmode="numeric" placeholder="Visual"
  onblur="ponerTexto(this, 'Visual');"
  onfocus="limpiarTexto(this, 'Visual')">

  <input class="bob-poros" type="tel" inputmode="numeric" placeholder="Poros"
  onblur="ponerTexto(this, 'Poros');"
  onfocus="limpiarTexto(this, 'Poros')">
</div>

    <input class="bob-otros" type="tel" inputmode="numeric" placeholder="Otros">

    <div class="row">
      <input class="bob-a1" type="tel" inputmode="numeric" placeholder="A1">
      <input class="bob-a2" type="tel" inputmode="numeric" placeholder="A2">
    </div>

    <div class="row">
      <input class="bob-a3" type="tel" inputmode="numeric" placeholder="A3">
      <input class="bob-a4" type="tel" inputmode="numeric" placeholder="A4">
    </div>

      <input class="bob-etiqueta" type="tel" inputmode="numeric" placeholder="Etiqueta">
      <input class="bob-medidos" type="tel" inputmode="numeric" placeholder="Medidos">
    </div>

  <div class="extra-box"></div>
</div>
  </div>

  <div class="extra-box"></div>

function cargarDatosBobina(div, datos){
  div.querySelector(".bob-marcha").value = datos.marcha || "";
  div.querySelector(".bob-parada").value = datos.parada || "";
  div.querySelector(".bob-total").value = datos.total || "";
  div.querySelector(".bob-acum").value = datos.acum || "";
  div.querySelector(".bob-cambio").value = datos.cambio || "";
  div.querySelector(".bob-cambio-acum").value = datos.cambioAcum || "";
  div.querySelector(".bob-golpes").value = datos.golpes || "";
  div.querySelector(".bob-primeras").value = datos.primeras || "";
  div.querySelector(".bob-esp-mas").value = datos.espMas || "";
  div.querySelector(".bob-esp-menos").value = datos.espMenos || "";
  div.querySelector(".bob-visual").value = datos.visual || "";
  div.querySelector(".bob-poros").value = datos.poros || "";
  div.querySelector(".bob-otros").value = datos.otros || "";
  div.querySelector(".bob-a1").value = datos.a1 || "";
  div.querySelector(".bob-a2").value = datos.a2 || "";
  div.querySelector(".bob-a3").value = datos.a3 || "";
  div.querySelector(".bob-a4").value = datos.a4 || "";
  div.querySelector(".bob-etiqueta").value = datos.etiqueta || "";
  div.querySelector(".bob-medidos").value = datos.medidos || "";
  const checks = div.querySelectorAll('.soldadura-box input[type="checkbox"]');

checks.forEach(c => {
  if(c.parentElement.innerText.trim() === datos.soldadura){
    c.checked = true;
  }
});

  if(datos.confirmada){
    confirmar(div.id, true);
  }
}

function confirmar(id, desdeCarga = false){
  const b = document.getElementById(id);
  const inputs = b.querySelectorAll("input");
  const boton = b.querySelector(".button");

  if(!b.classList.contains("confirmada")){
    inputs.forEach(i => i.disabled = true);
    b.classList.add("confirmada");
    boton.innerText = "✏ Editar";

    // 👉 SOLO si NO viene de carga
    if(!desdeCarga){
  mostrarMensajeConfirmacion("✔ Bobina confirmada");

  setTimeout(() => {
    const btnAdd = document.querySelector('[onclick="addBobina()"]');
    if(btnAdd){
      btnAdd.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }, 200);
    }

  } else {
    inputs.forEach(i => i.disabled = false);
    b.classList.remove("confirmada");
    boton.innerText = "✔ Confirmar";
  }
}

function quitarBobina(){

  if(contador === 0) return;

  const confirmar = confirm("¿Eliminar última bobina? Se perderán los datos.");

  if(!confirmar) return;

  const ultima = document.getElementById("b" + contador);
  if(ultima) ultima.remove();
  contador--;

}

function recogerBobinas(){
  const lista = [];
  const bloques = document.querySelectorAll(".bobina");

  bloques.forEach(b => {
    lista.push({
      marcha: b.querySelector(".bob-marcha").value,
      parada: b.querySelector(".bob-parada").value,
      total: b.querySelector(".bob-total").value,
      acum: b.querySelector(".bob-acum").value,
      cambio: b.querySelector(".bob-cambio").value,
      cambioAcum: b.querySelector(".bob-cambio-acum").value,
      golpes: b.querySelector(".bob-golpes").value,
      primeras: b.querySelector(".bob-primeras").value,
      espMas: b.querySelector(".bob-esp-mas").value,
      espMenos: b.querySelector(".bob-esp-menos").value,
      visual: b.querySelector(".bob-visual").value,
      poros: b.querySelector(".bob-poros").value,
      otros: b.querySelector(".bob-otros").value,
      a1: b.querySelector(".bob-a1").value,
      a2: b.querySelector(".bob-a2").value,
      a3: b.querySelector(".bob-a3").value,
      a4: b.querySelector(".bob-a4").value,
      etiqueta: b.querySelector(".bob-etiqueta").value,
      medidos: b.querySelector(".bob-medidos").value,
      soldadura: (() => {
  const checks = b.querySelectorAll('.soldadura-box input[type="checkbox"]');
  for(let c of checks){
    if(c.checked) return c.parentElement.innerText.trim();
  }
  return "";
})(),
      confirmada: b.classList.contains("confirmada")
    });
  });

  return lista;
}

function guardarParte(){
  limpiarCodigo();

  const numeroOrden = document.getElementById("orden").value;

  if(!numeroOrden){
    alert("Introduce Número de Orden");
    return;
  }

  const parte = {
    orden: numeroOrden,
    guardadoEn: Date.now(),
    linea: "CL05",
    fecha: document.getElementById("fecha").value,
    proveedor: document.getElementById("proveedor").value,
    codigo: document.getElementById("codigo").value,
    material1: document.getElementById("material1").value,
    material2: document.getElementById("material2").value,
    formato: document.getElementById("checkS").checked ? "S" : (document.getElementById("checkW").checked ? "W" : ""),
    ancho: document.getElementById("ancho").value,
    largo: document.getElementById("largo").value,
    espesor: document.getElementById("espesor").value,
    limite: document.getElementById("limite").value,
    diferencial: document.getElementById("diferencial").value,
    st: "ST",
    mecanico: document.getElementById("mecanico").value,
    apoyo: document.getElementById("apoyo").value,
    espesorOk: document.getElementById("espesorOk").checked,
    lineaOk: document.getElementById("lineaOk").checked,
    bobinas: recogerBobinas()
  };

  localStorage.setItem("parte_" + numeroOrden, JSON.stringify(parte));

  mostrarCodigo();
  alert("Parte guardado correctamente");
}

function verPartes(){

  const contenedor = document.getElementById("contenidoPartes");
  contenedor.innerHTML = "";

  const textoBusqueda = document.getElementById("buscadorPartes")?.value.toLowerCase() || "";

  const partes = [];

  // recoger partes
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);

    if(key.startsWith("parte_")){
      const parte = JSON.parse(localStorage.getItem(key));
      partes.push(parte);
    }
  }

  // ordenar por último guardado
  partes.sort((a, b) => (b.guardadoEn || 0) - (a.guardadoEn || 0));

  // pintar
  partes.forEach(parte => {

    const fechaFormateada = parte.fecha ? parte.fecha.split("-").reverse().join("/") : "";

    const texto = (parte.orden + " " + fechaFormateada).toLowerCase();

    // 🔍 FILTRO BUSCADOR
    if(!texto.includes(textoBusqueda)) return;

    const div = document.createElement("div");
    div.className = "guardado-item";

    div.innerHTML = `
      <div class="guardado-top">
        <span class="orden">Orden: ${parte.orden}</span>
      </div>
      <div class="guardado-fecha">
        Fecha: ${fechaFormateada}
      </div>
    `;

    div.onclick = function(){
      abrirParte(parte.orden);
    };

    const btnBorrar = document.createElement("button");
    btnBorrar.innerText = "❌";
    btnBorrar.onclick = function(e){
      e.stopPropagation();
      borrarParte(parte.orden);
    };

    div.appendChild(btnBorrar);
    contenedor.appendChild(div);
  });

}

function abrirParte(numeroOrden){
  const data = localStorage.getItem("parte_" + numeroOrden);

  if(!data){
    alert("No se encontró el parte");
    return;
  }

  const parte = JSON.parse(data);

  limpiarFormulario();

  document.getElementById("orden").value = parte.orden || "";
  document.getElementById("fecha").value = parte.fecha || "";
  document.getElementById("proveedor").value = parte.proveedor || "";
  document.getElementById("codigo").value = parte.codigo ? "Código " + parte.codigo : "";

  document.getElementById("material1").value = parte.material1 || "";
  document.getElementById("material2").value = parte.material2 || "";

  document.getElementById("checkS").checked = parte.formato === "S";
  document.getElementById("checkW").checked = parte.formato === "W";

  document.getElementById("ancho").value = parte.ancho || "";
  document.getElementById("largo").value = parte.largo || "";
  document.getElementById("espesor").value = parte.espesor || "";
  document.getElementById("limite").value = parte.limite || "";
  document.getElementById("diferencial").value = parte.diferencial || "";

  document.getElementById("mecanico").value = parte.mecanico || "";
  document.getElementById("apoyo").value = parte.apoyo || "";

  document.getElementById("espesorOk").checked = parte.espesorOk !== false;
  document.getElementById("lineaOk").checked = parte.lineaOk !== false;

  if(parte.bobinas && parte.bobinas.length){
    parte.bobinas.forEach(b => addBobina(b));
  }

  mostrarPantalla("parte");
}
  window.scrollTo({ top: 0, behavior: "smooth" });

function borrarParte(numeroOrden){
  const confirmar = confirm("¿Borrar parte " + numeroOrden + "?");

  if(!confirmar) return;

  localStorage.removeItem("parte_" + numeroOrden);
  verPartes();
}

function limpiarFormulario(){
  document.getElementById("orden").value = "";
  document.getElementById("fecha").value = "";
  document.getElementById("proveedor").value = "";
  document.getElementById("codigo").value = "";
  document.getElementById("material1").value = "";
  document.getElementById("material2").value = "";

  document.getElementById("checkS").checked = false;
  document.getElementById("checkW").checked = false;

  document.getElementById("ancho").value = "";
  document.getElementById("largo").value = "";
  document.getElementById("espesor").value = "";
  document.getElementById("limite").value = "";

  function calcularTotal(el){

  const bobina = el.closest(".bobina");

  const inicio = bobina.querySelector(".bob-marcha").value;
  const fin = bobina.querySelector(".bob-parada").value;
  const totalInput = bobina.querySelector(".bob-total");

  if(!inicio || !fin) return;

  const [h1, m1] = inicio.split(":").map(Number);
  const [h2, m2] = fin.split(":").map(Number);

  const minutosInicio = h1 * 60 + m1;
  const minutosFin = h2 * 60 + m2;

  let total = minutosFin - minutosInicio;

  if(total < 0) total += 24 * 60; // por si pasa medianoche

  totalInput.value = "Total " + total;
totalInput.setAttribute("data-valor", total);
    
    calcularAcumulados();
// aplicarFormatoVisual();
  }
  function calcularAcumulados(){

  let acumulado = 0;

  const bobinas = document.querySelectorAll(".bobina");

  bobinas.forEach(b => {

    const totalInput = b.querySelector(".bob-total");
const acumInput = b.querySelector(".bob-acum");

acumInput.value = acumInput.value.replace("Acum ", "");
    

    const total = parseInt(totalInput.value.replace("Total ", "")) || 0;

    acumulado += total;

    acumInput.value = "Acum " + acumulado;
acumInput.setAttribute("data-valor", acumulado);
     
    // aplicarFormatoVisual(total, acumulado);
  });
  }
  function calcularCambioAcumulado(){

  let acumulado = 0;

  const bobinas = document.querySelectorAll(".bobina");

  bobinas.forEach(b => {

    const cambioInput = b.querySelector(".bob-cambio");
    const cambioAcumInput = b.querySelector(".bob-cambio-acum");

    const cambio = parseInt(cambioInput.value.replace("Cambio ", "")) || 0;
    if(cambioInput.value && !cambioInput.value.startsWith("Cambio ")){
  cambioInput.value = "Cambio " + cambio;
    }

    acumulado += cambio;

    cambioAcumInput.value = "Cambio acum " + acumulado;

  });
  }
  function ponerTexto(input, texto){
  if(!input.value) return;

  // quitar texto si ya existe
  let valor = input.value.replace(texto + " ", "");

  input.value = texto + " " + valor;
}

function limpiarTexto(input, texto){
  input.value = input.value.replace(texto + " ", "");
}
  function aplicarFormatoVisual(){

  document.querySelectorAll(".bob-total").forEach(i=>{
    const v = i.getAttribute("data-valor");
    if(v) i.value = "Total " + v;
  });

  document.querySelectorAll(".bob-acum").forEach(i=>{
    const v = i.getAttribute("data-valor");
    if(v) i.value = "Acum " + v;
  });

  document.querySelectorAll(".bob-cambio").forEach(i=>{
    if(i.value) i.value = "Cambio " + i.value;
  });

  document.querySelectorAll(".bob-cambio-acum").forEach(i=>{
    if(i.value) i.value = "Cambio acum " + i.value;
  });

  }
  function saltoPersonal(input, siguienteId){
  if(input.value.length >= 2){
    document.getElementById(siguienteId).focus();
  }
  }
  function filtrarNumeros(input){
  input.value = input.value.replace(/\D/g, '');
  }
function saltoEnBobina(input, siguienteClase, longitud){
  if(input.value.length >= longitud){
    const bobina = input.closest(".bobina");
    const siguiente = bobina.querySelector("." + siguienteClase);
    if(siguiente){
      siguiente.focus();
    }
  }
}
  function seleccionarSoldadura(check){

  const contenedor = check.closest(".soldadura-box");
  const checks = contenedor.querySelectorAll('input[type="checkbox"]');

  checks.forEach(c => {
    if(c !== check){
      c.checked = false;
    }
  });

  }
  function mostrarMensajeConfirmacion(texto){

  const msg = document.getElementById("mensajeConfirmacion");

  msg.innerText = texto;
  msg.style.opacity = "1";

  setTimeout(() => {
    msg.style.opacity = "0";
  }, 1500);

  }
