<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parte Producción CL05</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
}

header {
  background: #1976d2;
  color: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.container {
  padding: 12px;
}

.section {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
}

h3 {
  margin-top: 0;
  color: #1976d2;
}

input {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.row {
  display: flex;
  gap: 8px;
}

.row input {
  flex: 1;
}

.button {
  background: #1976d2;
  color: white;
  padding: 12px;
  text-align: center;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 10px;
}

.button-danger {
  background: #dc2626;
}

.bobina {
  border: 1px dashed #ccc;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  background: #f8fbff;
}

.bobina-confirmada {
  background: #e6f7ed !important;
}

.check-line {
  display: flex;
  gap: 6px;
  align-items: center;
}
</style>
</head>

<body>

<header>SECCIÓN DE CORTE · PARTE PRODUCCIÓN CL05</header>

<div class="container">

<div class="section">
<h3>Cabecera</h3>

<div class="row">
<input type="number" placeholder="Número Orden">
<input value="CL05" disabled>
</div>

<label>Fecha</label>
<input type="date">

<input placeholder="Proveedor">

<input id="codigo" type="number" placeholder="Código (4 dígitos)" oninput="limitar(this,4);mostrarCodigo();">
<div id="codigoTexto">Código: —</div>

<label>Nº Material</label>
<div class="row">
<span>3000</span>
<input maxlength="2" oninput="limitar(this,2)">
<span>/</span>
<input maxlength="3" oninput="limitar(this,3)">
</div>
</div>

<div class="section">
<h3>Material</h3>

<div class="row">
<input placeholder="S">
<input placeholder="W">
</div>

<div class="row">
<input placeholder="Ancho">
<input placeholder="Largo">
</div>

<div class="row">
<input id="espesor" placeholder="Espesor" oninput="mostrarEspesor();">
<input placeholder="Txxx">
</div>

<div class="row">
<input placeholder="Dif">
<input value="ST" disabled>
</div>

<div id="espesorTexto">Resultado: —</div>
</div>

<div class="section">
<h3>Bobinas</h3>

<div id="bobinas"></div>

<div class="button" onclick="addBobina()">+ AÑADIR BOBINA</div>
<div class="button button-danger" onclick="quitarBobina()">− QUITAR BOBINA</div>

</div>

<div class="section">
<h3>Personal</h3>

<div class="row">
<input maxlength="2" placeholder="Mecánico">
<input maxlength="2" placeholder="Apoyo">
</div>
</div>

<div class="section">
<h3>Comprobaciones</h3>

<label class="check-line">
<input type="checkbox" checked> Espesor OK
</label>

<label class="check-line">
<input type="checkbox" checked> Línea OK
</label>

</div>

<div class="button">💾 GUARDAR PARTE</div>

</div>

<script>
let contadorBobinas = 0;

function limitar(input, max) {
  input.value = input.value.slice(0, max);
}

function mostrarCodigo() {
  const v = document.getElementById("codigo").value;
  document.getElementById("codigoTexto").innerText = v ? "Código: " + v : "Código: —";
}

function mostrarEspesor() {
  const v = document.getElementById("espesor").value;
  if(v){
    document.getElementById("espesorTexto").innerText = "Resultado: 0," + v;
  } else {
    document.getElementById("espesorTexto").innerText = "Resultado: —";
  }
}

function toggleConfirm(id){
  const b = document.getElementById(id);
  const inputs = b.querySelectorAll("input");
  const estado = b.dataset.estado;

  if(estado === "edit"){
    inputs.forEach(i => i.disabled = true);
    b.dataset.estado = "ok";
    b.classList.add("bobina-confirmada");
    b.querySelector(".btn").innerText = "✏ EDITAR";
  } else {
    inputs.forEach(i => i.disabled = false);
    b.dataset.estado = "edit";
    b.classList.remove("bobina-confirmada");
    b.querySelector(".btn").innerText = "✔ CONFIRMAR";
  }
}

function addBobina(){
  contadorBobinas++;

  const id = "b"+contadorBobinas;

  const div = document.createElement("div");
  div.className = "bobina";
  div.id = id;
  div.dataset.estado = "edit";

  div.innerHTML = `
  <strong>BOBINA ${contadorBobinas}</strong>

  <div class="row">
  <input type="time">
  <input type="time">
  </div>

  <div class="row">
  <input placeholder="Total">
  <input placeholder="Acum">
  </div>

  <div class="row">
  <input placeholder="Cambio">
  <input placeholder="Cambio acum">
  </div>

  <div class="row">
  <input placeholder="Golpes">
  <input placeholder="Primeras">
  </div>

  <div class="row">
  <input placeholder="+Esp">
  <input placeholder="-Esp">
  </div>

  <div class="row">
  <input placeholder="Visual">
  <input placeholder="Poros">
  </div>

  <input placeholder="Otros">

  <div class="row">
  <input placeholder="A1">
  <input placeholder="A2">
  </div>

  <div class="row">
  <input placeholder="A3">
  <input placeholder="A4">
  </div>

  <div class="row">
  <input placeholder="Etiqueta">
  <input placeholder="Medidos">
  </div>

  <div class="button btn" onclick="toggleConfirm('${id}')">
  ✔ CONFIRMAR
  </div>
  `;

  document.getElementById("bobinas").appendChild(div);
}

function quitarBobina(){
  if(contadorBobinas>0){
    document.getElementById("b"+contadorBobinas).remove();
    contadorBobinas--;
  }
}
</script>

</body>
</html>
