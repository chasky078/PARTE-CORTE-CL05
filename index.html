<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parte Producción CL05</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef3f8;
}

header {
  background: #1976d2;
  color: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.container { padding: 12px; }

.section {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.row {
  display: flex;
  gap: 8px;
}

.button {
  background: #1976d2;
  color: white;
  padding: 12px;
  text-align: center;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 10px;
}

.button-danger { background: red; }

.bobina {
  border: 1px dashed #ccc;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  background: #f8fbff;
}

.confirmada {
  background: #e6f7ed;
}

.material {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 28px;
  font-weight: bold;
}

.material input {
  width: 70px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>SECCIÓN DE CORTE · PARTE PRODUCCIÓN CL05</header>
  
  <div class="button" onclick="verPartes()">📂 PARTES GUARDADOS</div>

<div class="container">

<div class="section">
<h3>Cabecera</h3>

<div class="row">
<input type="tel" inputmode="numeric" enterkeyhint="next" placeholder="Número Orden">
<input value="CL05" disabled>
</div>

<input type="date">

<input placeholder="Proveedor" enterkeyhint="next">

<input 
  id="codigo"
  type="tel" 
  inputmode="numeric" 
  enterkeyhint="next" 
  placeholder="Código (máx 4)" 
  maxlength="4"
  onblur="mostrarCodigo()"
  onfocus="limpiarCodigo()"
>

<label>Nº MATERIAL</label>
<div class="material">
3 0 0 0
<input 
  id="material1"
  type="tel" 
  inputmode="numeric" 
  enterkeyhint="next" 
  maxlength="2"
  oninput="saltoMaterial()"
>
/
<input 
  id="material2"
  type="tel" 
  inputmode="numeric" 
  enterkeyhint="next" 
  maxlength="3"
>
</div>

</div>

<div class="section">
<h3>Datos</h3>

<div style="margin-bottom:10px;">
  
  <label class="check-line">
    <input type="checkbox" id="checkS" onclick="soloUno('S')">
    S (Recto)
  </label>

  <label class="check-line">
    <input type="checkbox" id="checkW" onclick="soloUno('W')">
    W (Scroll)
  </label>

</div>

<div class="row">
<input type="tel" inputmode="numeric" enterkeyhint="next" placeholder="Ancho">
<input type="tel" inputmode="numeric" enterkeyhint="next" placeholder="Largo">
</div>

<div class="row">
<input type="tel" inputmode="numeric" enterkeyhint="next" placeholder="Espesor">
<input placeholder="Txxx">
</div>

<div class="row">
<input type="tel" inputmode="numeric" enterkeyhint="done" placeholder="Dif">
<input value="ST" disabled>
</div>

</div>

<div class="section">
<h3>Bobinas</h3>
<div id="bobinas"></div>

<div class="button" onclick="addBobina()">+ Añadir bobina</div>
<div class="button button-danger" onclick="quitarBobina()">− Quitar bobina</div>
</div>

<div class="section">
<h3>Personal</h3>

<div class="row">
<input type="tel" inputmode="numeric" enterkeyhint="next" maxlength="2" placeholder="Mecánico">
<input type="tel" inputmode="numeric" enterkeyhint="done" maxlength="2" placeholder="Apoyo">
</div>
</div>

<div class="section">
<h3>Comprobaciones</h3>

<label><input type="checkbox" checked> Espesor OK</label><br>
<label><input type="checkbox" checked> Línea OK</label>

</div>

<div class="button" onclick="guardarParte()">💾 GUARDAR PARTE</div>
  <div id="listaPartes" class="section" style="display:none;">
  <h3>Partes guardados</h3>
  <div id="contenidoPartes"></div>
  </div>

</div>

<script>
let contador = 0;

function addBobina(){
  contador++;

  let div = document.createElement("div");
  div.className = "bobina";
  div.id = "b"+contador;

  div.innerHTML = `
  <b>BOBINA ${contador}</b>

  <div class="row">
  <input type="time">
  <input type="time">
  </div>

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="Total">
  <input type="tel" inputmode="numeric" placeholder="Acum">
  </div>

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="Cambio">
  <input type="tel" inputmode="numeric" placeholder="Cambio acum">
  </div>

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="Golpes">
  <input type="tel" inputmode="numeric" placeholder="Primeras">
  </div>

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="+Esp">
  <input type="tel" inputmode="numeric" placeholder="-Esp">
  </div>

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="Visual">
  <input type="tel" inputmode="numeric" placeholder="Poros">
  </div>

  <input type="tel" inputmode="numeric" placeholder="Otros">

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="A1">
  <input type="tel" inputmode="numeric" placeholder="A2">
  </div>

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="A3">
  <input type="tel" inputmode="numeric" placeholder="A4">
  </div>

  <div class="row">
  <input type="tel" inputmode="numeric" placeholder="Etiqueta">
  <input type="tel" inputmode="numeric" placeholder="Medidos">
  </div>

  <div class="button" onclick="confirmar('${"b"+contador}')">✔ Confirmar</div>
  `;

  document.getElementById("bobinas").appendChild(div);
}

function confirmar(id){
  let b = document.getElementById(id);
  let inputs = b.querySelectorAll("input");

  if(!b.classList.contains("confirmada")){
    inputs.forEach(i=>i.disabled=true);
    b.classList.add("confirmada");
    b.querySelector(".button").innerText="✏ Editar";
  }else{
    inputs.forEach(i=>i.disabled=false);
    b.classList.remove("confirmada");
    b.querySelector(".button").innerText="✔ Confirmar";
  }
}

function quitarBobina(){
  if(contador>0){
    document.getElementById("b"+contador).remove();
    contador--;
  }
}
  function mostrarCodigo(){
  const valor = document.getElementById("codigo").value;
  const texto = document.getElementById("codigoTexto");

  if(valor){
    texto.innerText = "Código " + valor;
  } else {
    texto.innerText = "Código —";
  }
  }
  function mostrarCodigo(){
  const input = document.getElementById("codigo");

  if(input.value){
    input.value = "Código " + input.value;
  }
}

function limpiarCodigo(){
  const input = document.getElementById("codigo");

  input.value = input.value.replace("Código ", "");
}
  function saltoMaterial(){
  const input = document.getElementById("material1");

  if(input.value.length >= 2){
    document.getElementById("material2").focus();
  }
  }
  function soloUno(tipo){
  if(tipo === "S"){
    document.getElementById("checkW").checked = false;
  } else {
    document.getElementById("checkS").checked = false;
  }
  }
  function guardarParte(){

  const numeroOrden = document.querySelector('input[placeholder="Número Orden"]').value;

  if(!numeroOrden){
    alert("Introduce Número de Orden");
    return;
  }

  const parte = {
  orden: numeroOrden,
  fecha: document.querySelector('input[type="date"]').value,
  proveedor: document.querySelector('input[placeholder="Proveedor"]').value
};

  localStorage.setItem("parte_" + numeroOrden, JSON.stringify(parte));

  alert("Parte guardado correctamente");
  }
  function verPartes(){
    alert("FUNCION ACTIVADA");

  const contenedor = document.getElementById("contenidoPartes");
  contenedor.innerHTML = "";

  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);

    if(key.startsWith("parte_")){
      const parte = JSON.parse(localStorage.getItem(key));

      const div = document.createElement("div");
      div.style.padding = "10px";
      div.style.borderBottom = "1px solid #ccc";

      div.innerText = "Orden: " + parte.orden;
    div.onclick = function(){
  abrirParte(parte.orden);
};

      contenedor.appendChild(div);
    }
  }

  document.getElementById("listaPartes").style.display = "block";
  }
  function abrirParte(numeroOrden){

  const data = localStorage.getItem("parte_" + numeroOrden);

  if(!data){
    alert("No se encontró el parte");
    return;
  }

  const parte = JSON.parse(data);

  // Rellenar campos
  document.querySelector('input[placeholder="Número Orden"]').value = parte.orden;
  document.querySelector('input[type="date"]').value = parte.fecha;
    document.querySelector('input[placeholder="Proveedor"]').value = parte.proveedor || "";

  // Ocultar lista
  document.getElementById("listaPartes").style.display = "none";
  }
</script>

</body>
</html>
